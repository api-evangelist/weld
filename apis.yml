aid: weld
name: Weld
description: >-
  Weld is a programmable data-infrastructure platform for moving and transforming
  data. It runs near real-time ELT/ETL pipelines from 300+ prebuilt connectors,
  log-based Change Data Capture (CDC), SQL-based data transformations with lineage
  and version history, and Reverse ETL to activate modeled data back into operational
  tools. The Weld Connect REST API and a hosted Model Context Protocol (MCP) server
  let developers and AI agents create connections, run and monitor ELT syncs, build
  and publish transforms, and orchestrate pipelines programmatically. Weld is a
  Copenhagen-based company backed by a16z and other leading investors.
